version: '3.8'

services:
  bot:
    build: .
    container_name: bx-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./memory.db:/app/memory.db
    working_dir: /app
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
